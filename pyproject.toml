[project]
name = "automl-experiment-framework"
version = "0.1.0"
description = "AutoML Experimentation Pipeline"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "optuna>=3.4",
    "mlflow>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
